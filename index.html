<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d211d"><title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Italiana&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="gate" id="gate"><div class="gate-card" id="open">
  <div class="gate-flower">❧</div><div class="gate-names en"><span id="gBride"></span><i>&</i><span id="gGroom"></span></div>
  <div class="envelope"><div class="flap"></div><div class="fold l"></div><div class="fold r"></div><div class="fold b"></div><button class="seal" id="seal"></button></div>
  <p>اضغط على الختم لفتح الدعوة</p></div></div>

<main id="site">
<section class="hero">
<img id="hero" alt=""><div class="veil"></div><button class="music" id="musicBtn" aria-label="تشغيل الموسيقى">♫</button>
<div class="hero-copy reveal"><span class="twig">❧</span><h1 class="en"><span id="bride"></span><i>&</i><span id="groom"></span></h1><p class="en date" id="dateLabel"></p></div><span class="down">⌄</span>
</section>

<section class="paper invite reveal"><div class="arch">
<span class="twig">❧</span><h2>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</h2><p id="intro"></p>
<div class="signature en"><span id="sBride"></span> <i>&</i> <span id="sGroom"></span></div></div>
<div class="orn">✣</div><h2 class="section-title">العد التنازلي للفرح</h2>
<div class="count"><div><b id="days"></b><small>يوم</small></div><div><b id="hours"></b><small>ساعة</small></div><div><b id="minutes"></b><small>دقيقة</small></div><div><b id="seconds"></b><small>ثانية</small></div></div>
</section>

<section class="paper reveal"><header class="heading"><i></i><span>❧</span><h2>برنامج الحفل</h2><i></i></header><div class="timeline" id="timeline"></div>
<div class="divider">✣</div><span class="twig">❧</span><h2 class="section-title">مكان الحفل</h2><div class="pin">●</div><h3 class="venue-name en" id="venue"></h3><p id="location"></p>
<figure class="photo"><img id="venueImg" alt="مكان الحفل"></figure><p class="body-copy" id="venueText"></p>
</section>

<section class="paper reveal"><div class="divider">✣</div><span class="twig">♙</span><h2 class="section-title">إطلالة الحفل</h2><p class="body-copy" id="dressText"></p><div class="palette" id="palette"></div>
<div class="divider">✣</div><figure class="photo wide"><img id="dinnerImg" alt="أجواء الحفل"></figure>
<div class="note"><span>♥</span><h2>ملاحظة</h2><p id="note"></p></div>
</section>

<section class="closing reveal"><div class="closing-shade"></div><div class="closing-copy"><span class="twig">❧</span><p id="closing"></p><div class="heart">♥</div><h2 class="en"><span id="cBride"></span><i>&</i><span id="cGroom"></span></h2><p class="en date" id="cDate"></p></div></section>
<footer><span id="footerInitials" class="en"></span><p>بكل الحب، ننتظركم</p></footer>
</main><audio id="audio" loop preload="auto"></audio><script src="config.js"></script><script src="script.js"></script></body></html>
